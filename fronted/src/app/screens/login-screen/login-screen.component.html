<section class="login-page">
  <div class="background-container">
    <div class="background-image"></div>
    <div class="background-overlay"></div>
  </div>

  <div class="content">
    <header class="header">
      <div class="logo-container">
        <img src="/assets/images/small_logo.png" alt="Logo BUAP" class="logo-image" />
        <span class="logo-text">BUAP</span>
      </div>
      <nav class="social-icons">
        <a href="https://apps.apple.com/mx/app/buap/id6683299623" class="social-link" aria-label="Apple">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"/>
            <path d="M10 2c1 .5 2 2 2 5"/>
          </svg>
        </a>
        <a href="https://play.google.com/store/apps/details?id=dcytic.appbuap" class="social-link" aria-label="Android">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/>
            <path d="M12 18h.01"/>
          </svg>
        </a>
        <a href="https://www.facebook.com/BUAPoficial/?locale=es_LA" class="social-link" aria-label="Facebook">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
          </svg>
        </a>
        <a href="https://www.instagram.com/buapoficial/?hl=es" class="social-link" aria-label="Instagram">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
            <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>
          </svg>
        </a>
      </nav>
    </header>

    <main class="main-content">
      <div class="mitec-logo">
        <div class="mitec-bars">
          <div class="bar bar-blue-dark"></div>   <!-- Pantone 302 C -->
          <div class="bar bar-white"></div>       <!-- Blanco -->
          <div class="bar bar-blue-light"></div>  <!-- Pantone 306 C -->
          <div class="bar bar-gray"></div>        <!-- Gris lobo -->
        </div>
        <div class="mitec-text">
          <span class="mi">Sistema </span><span class="tec"> Escolar</span>
        </div>
      </div>

      <h1 class="welcome-title">Bienvenido </h1>

      <form (ngSubmit)="login()" class="login-form" #form="ngForm">
        <div class="input-group">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="5"/>
            <path d="M20 21a8 8 0 0 0-16 0"/>
          </svg>
          <input
            type="email"
            [(ngModel)]="username"
            name="username"
            class="input-field"
            id="email"
            placeholder="Usuario..."
            autocomplete="username"
          />
          <button type="button" class="input-action" aria-label="Ayuda de usuario">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" x2="3" y1="12" y2="12"/>
            </svg>
          </button>
        </div>
        <div *ngIf="errors.username" class="invalid-feedback">{{ errors.username }}</div>

        <div class="input-group">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="16" r="1"/>
            <rect x="3" y="10" width="18" height="12" rx="2"/>
            <path d="M7 10V7a5 5 0 0 1 10 0v3"/>
          </svg>
          <input
            [type]="type"
            [(ngModel)]="password"
            id="password"
            name="password_user"
            class="input-field"
            placeholder="Contrasena..."
            autocomplete="current-password"
            (keyup.enter)="login()"
          />
          <span class="show-password" (click)="showPassword()">
            <i [ngClass]="type == 'password' ? 'bi bi-eye-fill' : 'bi bi-eye-slash-fill'"></i>
          </span>
        </div>
        <div *ngIf="errors.password" class="invalid-feedback">{{ errors.password }}</div>

        <button class="submit-button" type="submit" [disabled]="load">Ingresar</button>

        <div class="help-links">
          <a class="help-link" (click)="router.navigate(['olvide-contrasena'])">Olvidaste tu contrasena?</a>
          <a class="help-link" (click)="registrar()">Registrate</a>
        </div>
      </form>
    </main>

    <footer class="footer">
      <div class="footer-links">
        <a href="#" class="footer-link">Aviso de privacidad</a>
      </div>
      <div class="copyright">
        © 2026 <a href="https://buap.mx" class="copyright-link">BUAP</a>.
      </div>
    </footer>
  </div>
</section>
